<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificador de Set de Tenis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center">🎾 Verificador de Set</h2>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="jugadorA" class="form-label">Juegos ganados por A:</label>
        <input type="number" class="form-control" id="jugadorA" min="0" max="7" />
      </div>
      <div class="col-md-6">
        <label for="jugadorB" class="form-label">Juegos ganados por B:</label>
        <input type="number" class="form-control" id="jugadorB" min="0" max="7" />
      </div>
    </div>

    <button id="verificarBtn" class="btn btn-primary w-100">Verificar resultado</button>

    <div id="resultado" class="mt-4 fw-semibold fs-5 text-center"></div>
  </div>

  <script src="assets/js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificador de Probabilidad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4">🔍 Verificador de Probabilidad</h2>

    <div class="mb-3">
      <label for="numeroInput" class="form-label">Ingresa un número:</label>
      <input type="number" class="form-control" id="numeroInput" placeholder="Ej. 6, 55, 70" />
    </div>

    <button id="verificarBtn" class="btn btn-primary">Verificar</button>

    <div id="resultado" class="mt-4 fw-semibold fs-5"></div>
  </div>

  <script src="assets/js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
